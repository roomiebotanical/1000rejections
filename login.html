<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login · 1000 Rejections</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="navbar">

  <a href="index.html" class="logo">
    1000 REJECTIONS
  </a>

</header>


<main class="log-page">

  <p class="eyebrow">
    PRIVATE AREA
  </p>

  <h1>
    Welcome<br>
    back.
  </h1>


  <form id="loginForm" class="log-form">

    <label>

      <span>EMAIL</span>

      <input
        id="email"
        type="email"
        required
        autocomplete="email"
      >

    </label>


    <label>

      <span>PASSWORD</span>

      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
      >

    </label>


    <button
      type="submit"
      class="primary-button"
    >
      Login →
    </button>


    <p
      id="loginMessage"
      class="form-message"
    ></p>

  </form>

</main>

<script
  type="module"
  src="login.js">
</script>

</body>

</html>
